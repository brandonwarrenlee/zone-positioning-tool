<div class="wrap">

    </div>
    <md-switch id="theme" class="theme-toggle" icons aria-label="Dark mode">

      <svg slot="off-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<script>
(function(){
const S = 10, BASKET = {x:0, y:5.25}, NS = "http://www.w3.org/2000/svg";
const PRESETS = {
  "4out": {label:"4-1", pts:[[-6,25],[6,25],[-18,12],[18,12],[-4,8]]},
  "131":  {label:"1-3-1",      pts:[[0,27],[-17,18],[17,18],[0,17],[9,3.5]]},
  "122":  {label:"1-2-2",      pts:[[0,27],[-16,20],[16,20],[-8,6],[8,6]]},   // shown at ages 5 and 15
  "load": {label:"4-1 Load",   pts:[[0,26],[-17,17],[-21,3],[18,15],[7.5,8]]},  // shown at age 10
  "5out": {label:"5-out",      pts:[[0,27],[-17,20],[17,20],[-21,2.5],[21,2.5]]}
};
const state = {preset:"4out", off:[], ball:0, trap:false, age:10};

const svg = document.getElementById("court");
const gDef = document.getElementById("defense"), gOff = document.getElementById("offense");
// each defender's home area, in feet; neighbors overlap on purpose (gaps get covered by two people)
// polygons in feet (x across, y out from the baseline)
const G1 = [[2,15],[2,32],[-17,32],[-22,21],[-22,16],[-7,15]];
const F3 = [[-25,0],[-4,0],[-4,10],[-7,15],[-14,21.5],[-25,21.5]];
const mirror = pts => pts.map(([x,y])=>[-x,y]);
const ZONES = [
  {n:1, pts:G1},
  {n:2, pts:mirror(G1)},
  {n:3, pts:F3},
  {n:4, pts:mirror(F3)},
  {n:5, pts:[[-7,0],[7,0],[7,14],[3,20],[-3,20],[-7,14]]}
];
const gZones = document.getElementById("zones");
gZones.innerHTML = ZONES.map(z=>`<g class="zone" style="--zc:var(--z${z.n})"><polygon points="${z.pts.map(([x,y])=>`${x*S},${y*S}`).join(" ")}"/></g>`).join("");
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const P = (x,y)=>({x,y});
// rough reliable shooting range (feet from the rim) by age
const AGES = [5,10,15], RANGE = {5:9, 10:15, 15:21};
const outOfRange = p => Math.hypot(p.x - BASKET.x, p.y - BASKET.y) > RANGE[state.age];

function loadPreset(key){
  state.preset = key;
  state.off = PRESETS[key].pts.map(([x,y])=>P(x,y));
  state.ball = 0;
}

/* ---------- geometry helpers ---------- */
function toward(b, d){
  const dx=BASKET.x-b.x, dy=BASKET.y-b.y, L=Math.hypot(dx,dy)||1, k=Math.min(d, L*0.6)/L;
  return P(b.x+dx*k, b.y+dy*k);
}
// is a spot outside the 3-point arc? (arc is drawn around the original rim spot)
function beyond3(p){ return Math.hypot(p.x, p.y-5.25) > 19.75 || Math.abs(p.x) > 19.75; }
function trapPts(b, d=3.3, ang=0.9){
  const dx=BASKET.x-b.x, dy=BASKET.y-b.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const r=a=>P(b.x+(ux*Math.cos(a)-uy*Math.sin(a))*d, b.y+(ux*Math.sin(a)+uy*Math.cos(a))*d);
  return [r(ang), r(-ang)];
}
// give the trap spot closest to each defender's "home" side
function assignTrap(pts, homeA, homeB){
  const d=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
  return d(pts[0],homeA)+d(pts[1],homeB) <= d(pts[1],homeA)+d(pts[0],homeB) ? [pts[0],pts[1]] : [pts[1],pts[0]];
}

/* ---------- the zone brain ---------- */
function classify(b){ // b is mirrored so ball side is +x
  if (b.x < 10 && b.y >= 20) return "top";            // top of the key and the slots
  if (b.x < 9 && b.y >= 11) return "high";           // free-throw line / elbows only
  if (b.x < 9) return "low";
  if (b.y < 11) return b.x >= 14 ? "corner" : "short"; // short corner = baseline just outside the lane
  return "wing";
}
const J = (role, note)=>({role, note});

function solve(ball, trap){
  const side = ball.x >= 0 ? 1 : -1;
  const m = p=>P(p.x*side, p.y);
  const b = m(ball), X = b.x, Y = b.y;
  const id = {GB: side>0?2:1, GW: side>0?1:2, FB: side>0?4:3, FW: side>0?3:4, C:5};
  const zone = classify(b);
  const trapWanted = trap;
  trap = trap && state.age !== 5 && (["corner","short","low"].includes(zone) || (zone === "wing" && b.y < 19)); // wing trap only below FT line extended
  const ballD = d => outOfRange(b) ? 5.5 : d; // few 5th graders hit 3s: sag off the ball outside the arc // only trap where the sideline/baseline help
  let pos = {}, jobs = {}, onBall = [], pinned = [], tip = "";

  if (zone === "top"){
    if (!trap){
      pos.GB = toward(b, ballD(3)); pos.GW = P(-6+X*0.5, 20); pos.FB = P(10,8); pos.FW = P(-10,8); pos.C = P(0,9);
      onBall = ["GB"];
      jobs.GB = J("On the ball","Hands up. Stay between the ball and the basket.");
      jobs.GW = J("Guard the elbow","Stop the pass into the middle.");
      jobs.FB = J("Ball-side low","Ready to slide out if the ball goes to your wing.");
      // a wing is one pass away on the ball side: play up the line with a hand in the passing lane
      const wing = state.off.map((o,i)=>({o:m(o),i}))
        .filter(w=>w.i!==state.ball && w.o.x>9 && w.o.y>=8 && w.o.y<=22)
        .sort((a,c)=>Math.hypot(a.o.x-16,a.o.y-15)-Math.hypot(c.o.x-16,c.o.y-15))[0];
      if (wing){
        const w = wing.o, lane = P(b.x+(w.x-b.x)*0.75, b.y+(w.y-b.y)*0.75);
        pos.FB = toward(lane, 1.8); pos.C = P(2,7.5); pinned.push("FB");
        jobs.FB = J("Hand in the passing lane","Play up the line toward your wing, one hand in the lane. Don't overplay or they'll cut behind you.");
        jobs.C  = J("Cover the block","Slide toward the ball side to cover behind your forward.");
      }
      jobs.FW = J("Weak-side low","Stay near the paint and watch your side.");
      jobs.C  = J("Middle of the paint","Guard the high post from below.");
      tip = "One guard takes the ball. Everyone else keeps the ball out of the middle.";
    } else {
      [pos.GB, pos.GW] = assignTrap(trapPts(b), P(6,20), P(-6,20));
      pos.FB = P(13,16); pos.FW = P(-13,16); pos.C = P(0,14.5);
      onBall = ["GB","GW"];
      jobs.GB = jobs.GW = J("Trap","Both guards trap the ball. Arms wide, no reaching.");
      jobs.FB = J("Steal the wing pass","Step up into the passing lane.");
      jobs.FW = J("Steal the wing pass","Step up into the passing lane.");
      jobs.C  = J("Guard the middle","Cover the free-throw line.");
      tip = "Two guards trap at the top. The back three step up to steal the next pass.";
    }
  } else if (zone === "wing"){
    if (!trap){
      if (Y < 19){ // low wing: below the FT line extended the forward takes it, the guard stays up
        pos.FB = toward(b, ballD(3)); pos.GB = P(8.5,16.5); pos.GW = P(0,16); pos.C = P(4.5,6); pos.FW = P(-4,5.5);
        onBall = ["FB"];
        jobs.FB = J("On the ball","Below the free-throw line extended, the forward takes it. Stop the baseline drive.");
        jobs.GB = J("Ball-side elbow","Stay up. Stop the pass back out and anyone cutting to the middle.");
        jobs.GW = J("High post","Drop to the free-throw line.");
        jobs.C  = J("Ball-side block","Get in front of anyone on the block.");
        jobs.FW = J("Protect the rim","Weak side drops to the basket. Box out on shots.");
        tip = "Low wing: below the free-throw line extended, the forward takes the ball and the guard stays up.";
      } else { // high wing: guard takes it
        pos.GB = toward(b, ballD(3)); pos.GW = P(1.5,17); pos.FB = P(12,6); pos.C = P(4.5,6); pos.FW = P(-4,5.5);
        onBall = ["GB"];
        jobs.GB = J("On the ball","Above the free-throw line extended, the guard takes it. Keep them out of the middle.");
        jobs.GW = J("High post","Drop to the free-throw line.");
        jobs.FB = J("Ready for the low catch","If the ball goes lower or to the corner, it's yours.");
        jobs.C  = J("Ball-side block","Get in front of anyone on the block.");
        jobs.FW = J("Protect the rim","Weak side drops to the basket. Box out on shots.");
        tip = "High wing: above the free-throw line extended, the guard takes the ball.";
        // weak-side guard: elbow with a hand toward the top player; step up and deny if that player can shoot from there
        const topMan = state.off.map((o,i)=>({o:m(o),i}))
          .filter(w=>w.i!==state.ball && w.o.x<4 && w.o.y>=19)
          .sort((a,c)=>Math.hypot(a.o.x+6,a.o.y-24)-Math.hypot(c.o.x+6,c.o.y-24))[0];
        if (topMan){
          const canShoot = !outOfRange(topMan.o), t = canShoot ? 0.55 : 0.35, hp = P(0,16);
          pos.GW = P(hp.x+(topMan.o.x-hp.x)*t, Math.max(17, hp.y+(topMan.o.y-hp.y)*t)); pinned.push("GW");
          jobs.GW = canShoot
            ? J("Deny the swing pass","They can shoot from up top. Step up and get a hand in the passing lane.")
            : J("Elbow, hand to the top","Guard the high post from the elbow with your outside hand up toward the top. Close out if the ball swings.");
        }
      }
    } else {
      [pos.GB, pos.FB] = assignTrap(trapPts(b), P(X-2,Y+3), P(X,Y-4));
      pos.C = P(8.5,6); pos.GW = P(3,15.5); pos.FW = P(-2,6);
      onBall = ["GB","FB"];
      jobs.GB = jobs.FB = J("Trap the wing","Guard and forward trap together. Don't let them split you.");
      jobs.C  = J("Slide to the low post","Cover the ball-side block and short corner.");
      jobs.GW = J("High post","Guard the free-throw line.");
      jobs.FW = J("Protect the rim","You're the last line. Stay home.");
      tip = "Trap on the wing. The center slides over to cover the block.";
    }
  } else if (zone === "corner"){
    if (!trap){
      pos.FB = toward(b, ballD(3)); pos.C = P(5,5); pos.GB = P(11,15); pos.GW = P(0,15); pos.FW = P(-3,6);
      onBall = ["FB"];
      jobs.FB = J("On the ball","Close out short. Don't give up the baseline drive.");
      jobs.C  = J("Front the low post","Stay between the ball and the block.");
      jobs.GB = J("Ball-side elbow","Sag down. Stop the pass back out and the cutter.");
      jobs.GW = J("High post","Drop to the free-throw line.");
      jobs.FW = J("Protect the rim","Watch the skip pass and box out.");
      tip = "Corner pass: the ball-side forward takes it and the center fronts the block.";
    } else {
      [pos.FB, pos.GB] = assignTrap(trapPts(b), P(X-3,Y-1), P(X-1,Y+4));
      pos.C = P(5,6.5); pos.GW = P(10,16); pos.FW = P(-1,6);
      onBall = ["FB","GB"];
      jobs.FB = jobs.GB = J("Trap the corner","Use the sideline and baseline as extra defenders.");
      jobs.C  = J("Front the low post","Stay between the ball and the block.");
      jobs.GW = J("Deny the pass back out","Cover the pass from the corner back to the wing.");
      jobs.FW = J("Protect the rim","You're the last line. Stay home.");
      tip = "Trap in the corner. The sideline and baseline help you.";
    }
  } else if (zone === "short" && trap){
    [pos.C, pos.FB] = assignTrap(trapPts(b,3), P(X-4,Y), P(X+2,Y+2));
    pos.GB = P(10,15); pos.GW = P(0,15); pos.FW = P(-2,5);
    onBall = ["C","FB"];
    jobs.C = jobs.FB = J("Trap the short corner","Center and forward wall up. Arms straight up, no reaching.");
    jobs.GB = J("Cover the kick-out","Drop toward the wing to take the pass out of the trap.");
    jobs.GW = J("High post","Guard the free-throw line and the middle.");
    jobs.FW = J("Protect the rim","You're the only one at the basket. Box out on shots.");
    tip = "Trap the short corner. The center and forward trap, and the guards cover the passes out.";
  } else if (zone === "short"){
    pos.FB = toward(b,2.5); pos.C = P(Math.max(2.5, X-5.5), Math.max(5, Y)); pos.GB = P(9,15);
    pos.GW = P(0,14); pos.FW = P(-3.5,5);
    onBall = ["FB"];
    jobs.FB = J("On the ball","Stay between the ball and the basket. Don't give up the baseline.");
    jobs.C  = J("Cover the block","Stay on the rim side and front anyone on the block.");
    jobs.GB = J("Ball-side elbow","Drop to stop the pass back out and cutters to the middle.");
    jobs.GW = J("High post","Guard the free-throw line.");
    jobs.FW = J("Protect the rim","Weak side drops to the basket. Box out on shots.");
    tip = "Short corner: the ball-side forward takes it and the center protects the block.";
  } else if (zone === "high"){
    if (!trap){
      pos.C = toward(b,2.5); pos.GB = P(Math.min(X+5,11), Y+3); pos.GW = P(X-5, Y+3);
      pos.FB = P(5,6); pos.FW = P(-5,6);
      onBall = ["C"];
      jobs.C  = J("Step up on the ball","Meet them at the free-throw line with hands up.");
      jobs.GB = jobs.GW = J("Pinch down","Squeeze in so they can't turn and drive.");
      jobs.FB = jobs.FW = J("Cover the block","Slide in so nobody cuts for a layup.");
      tip = "Ball in the middle is dangerous. The center steps up and everyone pinches in.";
    } else {
      pos.GB = P(X+2.8, Y+2.2); pos.GW = P(X-2.8, Y+2.2);
      pos.C = toward(b,3); pos.FB = P(5.5,6); pos.FW = P(-5.5,6);
      onBall = ["GB","GW"];
      jobs.GB = jobs.GW = J("Dig in and double","Both guards collapse on the ball.");
      jobs.C  = J("Under the ball","Stay between the ball and the basket.");
      jobs.FB = jobs.FW = J("Cover the block","Slide in so nobody cuts for a layup.");
      tip = "Double the ball in the middle. Guards dig down, the center stays under it.";
    }
  } else { // low post
    if (!trap){
      pos.C = toward(b,2); pos.FB = P(Math.min(X+5,13), Math.max(Y,5)); pos.FW = P(-4,5.5);
      pos.GB = P(6,15); pos.GW = P(-5,15);
      onBall = ["C"];
      jobs.C  = J("Guard the post","Stay between the ball and the basket. Hands straight up.");
      jobs.FB = J("Help on the post","Dig in, but be ready for the pass back out.");
      jobs.FW = J("Protect the rim","Box out on the shot.");
      jobs.GB = jobs.GW = J("Sink to the elbow","Drop down to help and watch for kick-outs.");
      tip = "Ball in the post: the center guards it and the forwards help.";
    } else {
      [pos.C, pos.FB] = assignTrap(trapPts(b,3), P(X-3,Y), P(X+3,Y));
      pos.GB = P(10,15); pos.GW = P(0,15); pos.FW = P(-2,5);
      onBall = ["C","FB"];
      jobs.C = jobs.FB = J("Double the post","Two defenders, hands high. Don't foul.");
      jobs.GB = J("Cover the kick-out","Drop toward the wing to take the pass out of the trap.");
      jobs.GW = J("High post","Guard the free-throw line and the middle.");
      jobs.FW = J("Protect the rim","Stay home under the basket.");
      tip = "Double-team the post. The guards sink to cover the pass back out.";
    }
  }

  // weak-side forward guarding the rim: split the rim and the nearest weak-side shooter (help-side block), don't hide under the basket
  if (pos.FW && jobs.FW && jobs.FW.role === "Protect the rim" && !onBall.includes("FW")){
    const ws = state.off.map((o,i)=>({o:m(o),i}))
      .filter(w=>w.i!==state.ball && w.o.x < -8 && w.o.y < 24)
      .sort((a,c)=>Math.hypot(a.o.x+16,a.o.y-10)-Math.hypot(c.o.x+16,c.o.y-10))[0];
    if (ws){
      const t = 0.3, p = P(BASKET.x+(ws.o.x-BASKET.x)*t, BASKET.y+(ws.o.y-BASKET.y)*t);
      pos.FW = P(Math.max(p.x,-6.5), clamp(p.y,4.5,9)); pinned.push("FW");
      jobs.FW = J("Protect the rim, see your side","Stand on your block, between the rim and the wing on your side. Close out if they skip it over.");
    }
  }
  if (!trap && outOfRange(b) && onBall.length === 1){
    jobs[onBall[0]] = J("On the ball, a step off",`${state.age}-year-olds rarely score from out here. Stay a big step off and stop the drive.`);
  }
  // un-mirror and key by defender number
  const out = {}, onSet = new Set(), pinSet = new Set();
  for (const k of Object.keys(pos)){
    const n = id[k];
    out[n] = {p: m(pos[k]), job: jobs[k]};
    if (onBall.includes(k)) onSet.add(n);
    if (pinned.includes(k)) pinSet.add(n);
  }
  // older players shoot from farther out: off-ball defenders shade toward shooters who are in range for this age
  const pull = {5:0, 10:0.25, 15:0.6}[state.age] || 0;
  if (pull){
    for (let n=1;n<=5;n++){
      if (onSet.has(n)) continue;
      const d = out[n].p; let best=null, bd=14;
      state.off.forEach((o,i)=>{ if (i===state.ball || outOfRange(o)) return; const dd=Math.hypot(o.x-d.x,o.y-d.y); if (dd<bd){bd=dd;best=o;} });
      if (best){ const t = toward(best, 4.5); d.x += (t.x-d.x)*pull; d.y += (t.y-d.y)*pull; }
    }
  }
  // off-ball defenders shade toward an offensive player sitting in their area
  for (let n=1;n<=5;n++){
    if (onSet.has(n) || pinSet.has(n)) continue;
    const d = out[n].p; let best=null, bd=7;
    state.off.forEach((o,i)=>{ if(i===state.ball) return; const dd=Math.hypot(o.x-d.x,o.y-d.y); if(dd<bd){bd=dd;best=o;} });
    if (best){ const s=Math.min(0.3*bd,2)/(bd||1); d.x += (best.x-d.x)*s; d.y += (best.y-d.y)*s; }
  }
  // every off-ball player who can score from their spot needs a defender close enough to contest:
  // within 5 ft near the basket, within 8 ft on the perimeter. Never pull the last defender away from the rim.
  {
    const all = [1,2,3,4,5], rimD = p => Math.hypot(p.x-BASKET.x, p.y-BASKET.y);
    const nearest = o => Math.min(...all.map(n=>Math.hypot(out[n].p.x-o.x, out[n].p.y-o.y)));
    const used = new Set();
    const shooters = state.off.map((o,i)=>({o,i}))
      .filter(s => s.i!==state.ball && !outOfRange(s.o))
      .map(s => ({...s, lim: rimD(s.o) < 12 ? 5 : 8}))
      .sort((a,c) => (nearest(c.o)-c.lim) - (nearest(a.o)-a.lim));
    for (const s of shooters){
      if (nearest(s.o) <= s.lim) continue;
      const cands = all.filter(n => !onSet.has(n) && !used.has(n))
        .sort((a,c) => Math.hypot(out[a].p.x-s.o.x,out[a].p.y-s.o.y) - Math.hypot(out[c].p.x-s.o.x,out[c].p.y-s.o.y));
      for (const n of cands){
        const others = all.filter(k => k!==n && !onSet.has(k));
        const rimSafe = rimD(out[n].p) > 8 || others.some(k => rimD(out[k].p) <= 8);
        if (!rimSafe) continue;
        const spot = toward(s.o, s.lim - 1.5);
        out[n].p.x = spot.x; out[n].p.y = spot.y; used.add(n);
        out[n].job = J("Contest the shooter", `${state.age}-year-olds can score from that spot. Stay close enough to get a hand up.`);
        break;
      }
    }
  }
  // keep defenders from stacking on each other, and on the floor
  // no two dots may touch: defenders give way to each other and to the offense
  const GAP = 3.0;
  for (let it=0; it<10; it++){
    for (let a=1;a<=5;a++) for (let c=a+1;c<=5;c++){
      const p=out[a].p, q=out[c].p, dx=q.x-p.x, dy=q.y-p.y, dd=Math.hypot(dx,dy);
      if (dd < GAP){ const push=(GAP-dd)/2, ux=dd>0.01?dx/dd:1, uy=dd>0.01?dy/dd:0;
        p.x-=ux*push; p.y-=uy*push; q.x+=ux*push; q.y+=uy*push; }
    }
    for (let n=1;n<=5;n++){
      const p = out[n].p;
      state.off.forEach(o=>{
        let dx=p.x-o.x, dy=p.y-o.y, dd=Math.hypot(dx,dy);
        if (dd < GAP){
          if (dd < 0.01){ dx=BASKET.x-o.x; dy=BASKET.y-o.y; dd=Math.hypot(dx,dy)||1; if (dd<0.01){dx=0;dy=1;dd=1;} }
          p.x = o.x + dx/dd*GAP; p.y = o.y + dy/dd*GAP;
        }
      });
      p.x=clamp(p.x,-23.8,23.8); p.y=clamp(p.y,1.3,32);
    }
  }

  if (trapWanted && !trap){
    tip = {
      top:  "No trap at the top. One quick pass to the high post beats it. Stay in the zone and wait for the ball to go to a wing or corner.",
      high: "Never trap in the middle. There are too many open passes. The center steps up and everyone pinches in.",
      wing: "No trap on a high wing. Wait until the ball goes below the free-throw line extended, where the sideline helps.",
      short: "No trap in the short corner. It's too close to the basket, and one pass to the block is a layup.",
      low:  "No trap on the post. The center guards it and the forwards help, so nobody leaves a shooter wide open."
    }[zone];
  }
  if (trapWanted && state.age === 5) tip = "No trapping at age 5. A trap mostly gives up an easy layup. Keep one defender on the ball.";
  if (trap && state.age === 15) tip += " Against shooters, every trap leaves someone open. Trap only as a surprise.";
  const sideName = side>0 ? "Right" : "Left";
  const where = {top:"Top of the key", wing:`${sideName} wing`, corner:`${sideName} corner`, short:`${sideName} short corner`,
                 high:"High post", low: X<2 ? "Low post" : `${sideName} low post`}[zone];
  return {out, onSet, where, tip};
}

/* ---------- drawing ---------- */
const defEls = {};
for (let n=1;n<=5;n++){
  const g = document.createElementNS(NS,"g"); g.setAttribute("class","def");
  g.innerHTML = `<circle class="press" r="20"/><circle class="body" r="14"/><text class="tok-text">${n}</text>`;
  gDef.appendChild(g); defEls[n]=g;
}
const offEls = [];
for (let i=0;i<5;i++){
  const g = document.createElementNS(NS,"g"); g.setAttribute("class","off");
  g.setAttribute("tabindex","0"); g.setAttribute("role","button");
  g.setAttribute("aria-label",`Offense ${i+1}. Enter gives the ball, arrow keys move.`);
  g.innerHTML = `<circle class="hit" r="26"/><circle class="halo" r="19"/><circle class="body" r="14"/><text class="tok-text">${i+1}</text>
    <g class="ballmark" transform="translate(13,-13)"><circle class="b" r="8"/><path class="s" d="M-8 0 H8 M0 -8 V8 M-5.2 -6.1 C-2.4 -2.6 -2.4 2.6 -5.2 6.1 M5.2 -6.1 C2.4 -2.6 2.4 2.6 5.2 6.1"/><circle class="rimline" r="8"/></g>`;
  gOff.appendChild(g); offEls.push(g); wire(g,i);
}

function render(){
  state.off.forEach((o,i)=>{
    offEls[i].setAttribute("transform",`translate(${o.x*S} ${o.y*S})`);
    offEls[i].classList.toggle("has-ball", i===state.ball);
  });
  const r = solve(state.off[state.ball], state.trap);
  for (let n=1;n<=5;n++){
    const p = r.out[n].p;
    defEls[n].style.transform = `translate(${p.x*S}px, ${p.y*S}px)`;
    defEls[n].classList.toggle("onball", r.onSet.has(n));
  }
  document.getElementById("where").textContent = "Ball at the " + r.where.toLowerCase();
  document.getElementById("tip").textContent = r.tip;
  document.getElementById("jobs").innerHTML = [1,2,3,4,5].map(n=>{
    const j = r.out[n].job;
    return `<md-list-item><span slot="start" class="chip${r.onSet.has(n)?" hot":""}">${n}</span><div slot="headline">${j.role}</div></md-list-item>`;
  }).join("");
}

/* ---------- interaction ---------- */
function toCourt(e){
  const pt = svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  return P(clamp(q.x/S,-24,24), clamp(q.y/S,0.8,32.5));
}
function placeOff(i, p){
  const GAP = 3.0;
  for (let it=0; it<6; it++){
    state.off.forEach((o,j)=>{
      if (j===i) return;
      let dx=p.x-o.x, dy=p.y-o.y, d=Math.hypot(dx,dy);
      if (d < GAP){ if (d<0.01){dx=0;dy=1;d=1;} p.x=o.x+dx/d*GAP; p.y=o.y+dy/d*GAP; }
    });
    p.x=clamp(p.x,-24,24); p.y=clamp(p.y,0.8,32.5);
  }
  return p;
}
let drag = null;
function wire(g,i){
  // stop the page from scrolling while a finger drags a player (older iOS ignores touch-action on SVG)
  g.addEventListener("touchstart", e=>e.preventDefault(), {passive:false});
  g.addEventListener("pointerdown",e=>{
    e.preventDefault(); g.setPointerCapture(e.pointerId);
    drag = {i, x:e.clientX, y:e.clientY, moved:false};
  });
  g.addEventListener("pointermove",e=>{
    if (!drag || drag.i!==i) return;
    if (!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 5) return;
    drag.moved = true; state.off[i] = placeOff(i, toCourt(e)); render();
  });
  const end = ()=>{ if (drag && drag.i===i && !drag.moved){ state.ball=i; render(); } drag=null; };
  g.addEventListener("pointerup",end);
  g.addEventListener("pointercancel",()=>{drag=null;});
  g.addEventListener("keydown",e=>{
    const o = state.off[i], step = e.shiftKey?3:1;
    const mv = {ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
    if (mv){ e.preventDefault(); state.off[i]=placeOff(i, P(o.x+mv[0], o.y+mv[1])); render(); }
    else if (e.key==="Enter"||e.key===" "){ e.preventDefault(); state.ball=i; render(); }
  });
}

const presetBox = document.getElementById("presets");
// age 10 gets 4-1 Load; ages 5 and 15 get 1-2-2 in its place
function buildPresets(){
  presetBox.innerHTML = "";
  Object.entries(PRESETS).forEach(([k,v])=>{
    if (k==="load" && state.age!==10) return;
    if (k==="122" && state.age===10) return;
    const b = document.createElement("md-outlined-button"); b.id="preset-"+k; b.textContent=v.label;
    b.addEventListener("click",()=>{ loadPreset(k); render(); });
    presetBox.appendChild(b);
  });
}
buildPresets();
document.getElementById("trap").addEventListener("change",e=>{ state.trap = !!e.target.selected; render(); });
document.getElementById("show-zones").addEventListener("change",e=>{ gZones.style.display = e.target.selected ? "" : "none"; });
const ageInput = document.getElementById("age"), ageLabel = document.getElementById("age-label");
const setAge = ()=>{
  const v = Number(ageInput.value); state.age = AGES.includes(v) ? v : 10;
  ageLabel.textContent = `Age · ${state.age} years`; buildPresets(); render();
};
ageInput.addEventListener("input", setAge);
ageInput.addEventListener("change", setAge);

// light/dark mode switch in the header
const themeSw = document.getElementById("theme"), rootEl = document.documentElement;
const applyTheme = dark => { rootEl.setAttribute("data-theme", dark ? "dark" : "light"); themeSw.selected = dark; themeSw.toggleAttribute("selected", dark); };
let savedTheme = null; try { savedTheme = localStorage.getItem("zone-theme"); } catch (err) {}
const hostTheme = rootEl.getAttribute("data-theme");
applyTheme(savedTheme ? savedTheme === "dark" : hostTheme ? hostTheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
themeSw.addEventListener("change", e => {
  const dark = !!e.target.selected; applyTheme(dark);
  try { localStorage.setItem("zone-theme", dark ? "dark" : "light"); } catch (err) {}
});

// first paint without the slide-in animation
Object.values(defEls).forEach(g=>g.style.transition="none");
loadPreset("4out"); render();
requestAnimationFrame(()=>requestAnimationFrame(()=>Object.values(defEls).forEach(g=>g.style.transition="")));
})();
</script>

</html>
